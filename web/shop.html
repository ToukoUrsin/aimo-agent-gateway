<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Verkkokauppa · tilausapurin prototyyppi</title>
<meta name="description" content="How an order assistant would sit inside a wholesaler's own web shop: the signed-in cook says what they will serve and gets one cart, checked in code, that they confirm themselves.">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/static/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css">
<style>
html,body{height:100%}
body{overflow:hidden;background:var(--panel)}
.app{height:100dvh;display:flex;flex-direction:column}
.banner{flex:none;padding:4px 16px}

/* the shop's own header */
.top{flex:none;border-bottom:1px solid var(--line);background:var(--panel)}
.bar1{display:flex;align-items:center;gap:var(--s4);height:60px;padding:0 var(--s5)}
.logo{display:flex;align-items:center;gap:10px;flex:none;text-decoration:none;color:var(--ink);min-width:0}
.logo i{width:26px;height:26px;border-radius:7px;background:var(--ink);flex:none;display:grid;place-items:center}
.logo i::after{content:"";width:9px;height:9px;border:2px solid var(--panel);border-radius:2px}
.logo b{display:block;font-size:var(--t4);font-weight:600;letter-spacing:-.01em;line-height:1.2;white-space:nowrap}
.logo span{display:block;font-size:var(--t1);color:var(--muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{flex:1;max-width:420px;margin-left:var(--s4);position:relative}
.search input{width:100%;height:40px;border:1px solid var(--line-2);border-radius:999px;padding:0 16px 0 38px;background:var(--bg);font-size:var(--t3);outline:none}
.search input:focus{border-color:var(--ink);background:var(--panel)}
.search svg{position:absolute;left:13px;top:12px;width:16px;height:16px;color:var(--muted)}
.acct{margin-left:auto;text-align:right;min-width:0;line-height:1.3}
.acct b{display:block;font-size:var(--t3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct span{display:block;font-size:var(--t1);color:var(--muted);white-space:nowrap}
.lang{display:flex;border:1px solid var(--line-2);border-radius:999px;padding:2px;flex:none}
.lang button{border:0;background:none;height:30px;min-width:38px;border-radius:999px;font-size:var(--t1);font-weight:600;color:var(--muted);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--panel)}
.tabs{display:flex;gap:2px;padding:0 var(--s4);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;flex:none;border:0;background:none;height:44px;padding:0 12px;font-size:var(--t3);color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current=true]{color:var(--ink);font-weight:600}
.tabs button[aria-current=true]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2px;background:var(--ink)}
.tabs .n{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--ink);color:var(--panel);font-size:11px;font-weight:600;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.tabs .only-phone{display:none}
#shoph .ph{display:none}

/* body: shop on the left, the assistant on the right */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 480px}
.shop,.panel{overflow-y:auto;background:var(--bg);padding:var(--s6) var(--s6) var(--s7)}
.panel{display:none}
.main[data-view=orders] .panel,.main[data-view=approvals] .panel{display:block}
.main[data-view=orders] .shop,.main[data-view=approvals] .shop{display:none}
.shop .in,.panel .in{max-width:760px}
.shop h1,.panel h1{font-size:var(--t7);letter-spacing:-.02em}
.shop .lede,.panel .lede{margin:var(--s2) 0 0;color:var(--muted);font-size:var(--t4);max-width:52ch}
.shop .search.inline{display:none}
.shelfh{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);margin:var(--s6) 0 var(--s3)}
.shelfh h2{font-size:var(--t4);font-weight:600}
.shelfh span{font-size:var(--t2);color:var(--muted);text-align:right}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s3)}
.tile{display:flex;flex-direction:column;text-align:left;border:1px solid var(--line);border-radius:var(--r-l);background:var(--panel);padding:var(--s3);cursor:pointer;min-width:0;transition:border-color .15s,transform .1s}
.tile:hover{border-color:var(--line-2)}
.tile:active{transform:translateY(1px)}
.tile .im{height:96px;border-radius:var(--r);background:#fff;display:grid;place-items:center;overflow:hidden;margin-bottom:var(--s3)}
.tile .im img{width:100%;height:100%;object-fit:contain}
.tile .im.none{background:var(--soft);color:var(--faint)}
.tile .im.none svg{width:30px;height:30px}
.tile b{font-size:var(--t2);font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.tile .pr{margin-top:6px;font-size:var(--t2);color:var(--muted);font-variant-numeric:tabular-nums}
.tile .go{margin-top:var(--s2);font-size:var(--t1);font-weight:600;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.tile.sk .im,.tile.sk b,.tile.sk .pr{background:var(--soft);color:transparent;border-radius:6px}
.links{display:flex;flex-direction:column;gap:2px;margin-top:var(--s6);border-top:1px solid var(--line);padding-top:var(--s3)}
.links a{display:flex;align-items:center;justify-content:space-between;min-height:44px;font-size:var(--t3);text-decoration:none;color:var(--ink-2);border-bottom:1px solid var(--line)}
.links a::after{content:"→";color:var(--faint)}
.links a:hover{color:var(--ink)}
.fine{margin-top:var(--s5);font-size:var(--t1);color:var(--faint);line-height:1.5}

/* Tilaukset and Hyväksynnät */
.panel h2{font-size:var(--t4);font-weight:600;margin:var(--s6) 0 var(--s3)}
.panel .empty{font-size:var(--t3);color:var(--muted);margin:var(--s4) 0 0}
.ol{display:flex;flex-direction:column;gap:var(--s3)}
.oc{border:1px solid var(--line);border-radius:var(--r-l);background:var(--panel);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s2);min-width:0}
.oc .h{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3)}
.oc .h b{font-size:var(--t4);font-weight:600}
.oc .h span{font-size:var(--t3);font-variant-numeric:tabular-nums;white-space:nowrap}
.oc .m{font-size:var(--t2);color:var(--muted);line-height:1.5}
.oc .q{font-size:var(--t2);color:var(--ink-2);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.oc .acts{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:2px}
.oc ul{margin:0;padding:0;list-style:none;font-size:var(--t2);color:var(--ink-2);line-height:1.6}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--esc-bg);color:var(--esc);white-space:nowrap}
.tag.ok{background:var(--pass-bg);color:var(--pass)}

/* the assistant */
.chat{display:flex;flex-direction:column;min-height:0;min-width:0;border-left:1px solid var(--line);background:var(--panel)}
.chath{flex:none;display:flex;align-items:center;justify-content:space-between;gap:var(--s3);height:52px;padding:0 var(--s4);border-bottom:1px solid var(--line)}
.chath b{font-size:var(--t3);font-weight:600;display:flex;align-items:center;gap:8px}
.chath b::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pass)}
.lnkbtn{border:0;background:none;color:var(--muted);font-size:var(--t2);cursor:pointer;min-height:44px;padding:0 4px;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.lnkbtn:hover{color:var(--ink)}
.log{position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:var(--s4) var(--s4) var(--s5);display:flex;flex-direction:column;gap:var(--s3)}
.msg{max-width:100%;font-size:var(--t4);line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.bot{color:var(--ink);padding-right:var(--s4)}
.msg.bot p{margin:0}
.msg.bot p+p{margin-top:var(--s2)}
.msg.me{align-self:flex-end;max-width:86%;background:var(--ink);color:var(--panel);border-radius:18px 18px 4px 18px;padding:9px 14px}
.msg.me img{display:block;max-width:180px;max-height:180px;border-radius:10px;margin:2px 0 6px}
.msg.me .ph{display:block;font-size:var(--t1);opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s1)}
.chips button{border:1px solid var(--line-2);background:var(--panel);border-radius:999px;min-height:40px;padding:8px 14px;font-size:var(--t2);line-height:1.3;text-align:left;cursor:pointer;color:var(--ink)}
.chips button:hover{background:var(--hover)}
.tool{display:flex;flex-direction:column;gap:4px;min-width:0}
.tool .cap{font-size:var(--t1);color:var(--faint)}
.tool iframe{display:block;width:100%;height:160px;border:0;background:transparent;color-scheme:normal}
.status{display:flex;align-items:center;gap:10px;font-size:var(--t2);color:var(--muted)}
.dots{display:inline-flex;gap:3px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:bl 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.err{font-size:var(--t3);color:var(--deny);display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.err .btn{height:36px}
.note{font-size:var(--t1);color:var(--faint);text-align:center}

/* the cart: the answer first (what, how much, delivery day, total, one button); the lines and the checks behind a tap */
.cart{border:1px solid var(--line-2);border-radius:var(--r-l);background:var(--panel);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);min-width:0;box-shadow:0 1px 2px rgba(20,20,22,.04)}
.cart.done{border-color:var(--pass)}
.cart.off{opacity:.6}
.cart .hd{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3)}
.cart .hd b{font-size:var(--t5);font-weight:600;letter-spacing:-.01em;line-height:1.25}
.cart .hd span{font-size:var(--t2);color:var(--muted);white-space:nowrap}
.cart .made{margin:0;font-size:var(--t2);font-weight:600;line-height:1.4}
.chips.try{align-items:center}.chips.try span{font-size:var(--t2);color:var(--muted)}
.msg .langnote{margin-top:6px;color:var(--muted);font-size:13px}
.cart .ask{margin:-6px 0 0;font-size:var(--t2);color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.nt .dl{display:block;margin-top:3px}
.nt .morerows{min-height:28px;margin-top:2px;font-size:var(--t2);font-weight:600}
.appr .alone{display:block;min-height:32px;margin-top:6px;text-align:left;font-size:var(--t2)}
.okline .demo{font-weight:400;color:var(--muted)}
.nt{border-left:3px solid var(--esc);background:var(--esc-bg);border-radius:0 var(--r) var(--r) 0;padding:8px 10px;font-size:var(--t2);line-height:1.45;color:var(--ink);overflow-wrap:anywhere}
.nt b{font-weight:600}
.nt.info{border-left-color:var(--line-2);background:var(--soft)}
.nt.bad{border-left-color:var(--deny);background:var(--deny-bg)}
.nt .mu{color:var(--muted)}
.nt .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sm{border:1px solid var(--line-2);background:var(--panel);border-radius:999px;min-height:36px;padding:6px 12px;font-size:var(--t2);line-height:1.25;cursor:pointer;color:var(--ink);text-align:left}
.sm:hover{background:var(--hover)}
.sm.pri{background:var(--ink);border-color:var(--ink);color:var(--panel);font-weight:600}
.sm:disabled{opacity:.5;cursor:default}
.alts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.alts .sm{border-radius:var(--r);display:flex;justify-content:space-between;gap:var(--s3);align-items:baseline}
.alts .sm span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.alts .sm[aria-current=true]{border-color:var(--ink);font-weight:600}
.sum{display:grid;grid-template-columns:1fr auto;gap:5px var(--s3);font-size:var(--t3);margin:0}
.sum dt{color:var(--muted)}
.sum dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.sum .tot{font-weight:600;font-size:var(--t4);color:var(--ink)}
.cta{height:48px;border-radius:999px;border:0;background:var(--ink);color:var(--panel);font-size:var(--t4);font-weight:600;cursor:pointer;width:100%}
.cta:hover{opacity:.9}
.cta:disabled{opacity:.45;cursor:default}
.tick{display:flex;gap:10px;align-items:flex-start;margin:12px 0 10px;font-size:var(--t2);line-height:1.4;color:var(--ink);cursor:pointer}
.tick input{width:22px;height:22px;flex:none;margin:0;accent-color:var(--ink)}
a.cta{display:grid;place-items:center;text-decoration:none;background:var(--panel);color:var(--ink);border:1px solid var(--line-2)}
.appr{border:1px solid var(--line);border-radius:var(--r);padding:var(--s3);display:grid;grid-template-columns:minmax(0,1fr) 108px;gap:var(--s2) var(--s3);align-items:start;font-size:var(--t2);line-height:1.45}
.appr .rest{grid-column:1/-1}
.appr b{display:block;font-size:var(--t3);font-weight:600;margin-bottom:2px}
.appr p{margin:0 0 6px}
.appr .mu{color:var(--muted)}
.appr .qr{width:108px;height:108px;background:#fff;border-radius:6px;overflow:hidden}
.appr .qr svg{display:block;width:100%;height:100%}
.okline{font-size:var(--t3);color:var(--pass);font-weight:600}
.folds{display:flex;flex-wrap:wrap;gap:0 var(--s4);margin:-4px 0 -8px}
.folds .lnkbtn{min-height:40px;color:var(--ink-2)}
.rows{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
.rows li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px var(--s3);padding:8px 0;border-bottom:1px solid var(--line);font-size:var(--t2);line-height:1.4}
.rows li b{font-weight:500}
.rows li .a{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rows li .s{grid-column:1/-1;color:var(--muted);font-size:var(--t1)}
.chk{margin:0;padding:0;list-style:none;font-size:var(--t1);line-height:1.5;color:var(--ink-2);border-top:1px solid var(--line)}
.chk li{padding:6px 0;border-bottom:1px solid var(--line)}
.chk li b{font-weight:600;color:var(--ink)}
.chk .p{color:var(--pass)}.chk .e{color:var(--esc)}.chk .d{color:var(--deny)}
.chk .mono{font-family:var(--mono);word-break:break-all}

.quick{display:flex;gap:var(--s2);min-width:0;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--s3)) var(--s2);padding:2px var(--s3)}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;border:1px solid var(--line-2);background:var(--panel);border-radius:999px;height:36px;padding:0 13px;font-size:var(--t2);white-space:nowrap;cursor:pointer;color:var(--ink)}
.quick button:hover{background:var(--hover)}
.quick button.new{border-style:dashed;color:var(--muted)}
.compose{flex:none;border-top:1px solid var(--line);padding:var(--s2) var(--s3) calc(var(--s2) + env(safe-area-inset-bottom));background:var(--panel)}
.att{display:flex;align-items:center;gap:var(--s2);margin:2px 0 var(--s2);font-size:var(--t2);color:var(--muted)}
.att img{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.row{display:flex;align-items:flex-end;gap:var(--s2)}
.row textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line-2);border-radius:22px;padding:11px 16px;min-height:44px;max-height:140px;font-size:16px;line-height:1.35;background:var(--bg);outline:none}
.row textarea:focus{border-color:var(--ink);background:var(--panel)}
.ib{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ib svg{width:20px;height:20px}
.ib.send{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.ib:disabled{opacity:.4;cursor:default}

@media (max-width:900px){
  .main{grid-template-columns:minmax(0,1fr)}
  .chat{border-left:0}
  .main[data-view=chat] .shop{display:none}
  .main:not([data-view=chat]) .chat{display:none}
  .tabs .only-phone{display:flex}
  #shoph .ph{display:inline}#shoph .wd{display:none}
  .bar1 .search{display:none}
  .shop .search.inline{display:block;margin:var(--s4) 0 0;max-width:none}
  .shop,.panel{padding:var(--s5) var(--s4) var(--s6)}
  .chath{display:none}
}
@media (max-width:560px){
  .bar1{height:54px;padding:0 var(--s4);gap:var(--s3)}
  .logo div{display:none}
  .banner{font-size:11px;padding:3px 12px}
  .tabs{padding:0 var(--s2)}
  .tabs{gap:0;justify-content:space-between}
  .tabs button{padding:0 4px;font-size:13px;gap:3px}
  .tabs .n{min-width:15px;height:15px;padding:0 4px;font-size:10px}
  .tabs button[aria-current=true]::after{left:4px;right:4px}
  .shelf{grid-template-columns:repeat(2,minmax(0,1fr))}
  .log{padding:var(--s3) var(--s3) var(--s4)}
  .shop h1,.panel h1{font-size:var(--t6)}
  .cart{padding:var(--s3)}
  .appr{grid-template-columns:minmax(0,1fr) 92px}
  .appr .qr{width:92px;height:92px}
}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.6}}
</style>
</head>
<body>
<div class="app">
  <div class="banner" data-s="banner"></div>
  <header class="top">
    <div class="bar1">
      <a class="logo" href="/shop" aria-label="Verkkokauppa / Web shop"><i></i><div><b data-s="portal"></b><span data-s="minun"></span></div></a>
      <form class="search" role="search" data-search><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><input type="search" name="q" data-p="search" autocomplete="off"></form>
      <div class="acct"><b id="acct">&nbsp;</b><span id="custno">&nbsp;</span></div>
      <div class="lang" role="group" aria-label="Kieli / Language"><button type="button" data-lang="fi">FI</button><button type="button" data-lang="en">EN</button></div>
    </div>
    <nav class="tabs" aria-label="Verkkokauppa">
      <button type="button" data-tab="order" aria-current="true" data-s="t_order"></button>
      <button type="button" data-tab="shelf" class="only-phone" data-s="t_shelf"></button>
      <button type="button" data-tab="orders"><span data-s="t_orders"></span><span class="n" id="ordn" hidden></span></button>
      <button type="button" data-tab="approvals"><span data-s="t_appr"></span><span class="n" id="apprn" hidden></span></button>
      <button type="button" data-tab="proposals"><span data-s="t_props"></span><span class="n" id="propn" hidden></span></button>
    </nav>
  </header>
  <div class="main" id="main" data-view="chat">
    <section class="shop" aria-labelledby="shoph">
      <div class="in">
        <h1 id="shoph"><span class="wd" data-s="shop_h"></span><span class="ph" data-s="t_shelf"></span></h1>
        <p class="lede" data-s="shop_lede"></p>
        <form class="search inline" role="search" data-search><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><input type="search" name="q" data-p="search" autocomplete="off"></form>
        <div class="shelfh"><h2 data-s="shelf_h"></h2><span data-s="shelf_tap"></span></div>
        <div class="shelf" id="shelf"></div>
        <nav class="links"><a href="/byhand" data-s="byhand"></a><a href="/access" data-s="access"></a></nav>
        <p class="fine" data-s="fine"></p>
      </div>
    </section>
    <section class="panel" id="panel" aria-live="polite"><div class="in" id="panelin"></div></section>
    <section class="chat" aria-label="Tilausapuri">

    deviceCapabilities: { touch: coarse, hover: matchMedia("(hover:hover)").matches }, containerDimensions: { width: f.iframe.clientWidth, maxHeight: 8000 },
    toolInfo: { tool: tools[f.name] || { name: f.name } },
    styles: { variables: { "--color-background-primary": v("--panel"), "--color-background-secondary": v("--soft"), "--color-background-tertiary": v("--hover"), "--color-text-primary": v("--ink"), "--color-text-secondary": v("--ink-2"),
      "--color-text-tertiary": v("--muted"), "--color-border-primary": v("--line-2"), "--color-border-secondary": v("--line"), "--color-text-success": v("--pass"), "--color-text-warning": v("--esc"), "--color-text-danger": v("--deny") } } };
}
addEventListener("message", async ev => {
  const f = frames.find(x => x.iframe.contentWindow === ev.source), m = ev.data;
  if (!f || !m || m.jsonrpc !== "2.0" || !m.method) return;
  const answer = body => { if (m.id !== undefined) ev.source.postMessage({ jsonrpc: "2.0", id: m.id, ...body }, "*"); };
  const p = m.params || {};
  try {
    if (m.method === "ui/initialize") answer({ result: { protocolVersion: PROTO, hostInfo: { name: "aimo-shop", version: "1.0.0" },
      hostCapabilities: { openLinks: {}, serverTools: {}, serverResources: {}, logging: {}, downloadFile: {}, updateModelContext: { text: {} }, message: { text: {} } }, hostContext: hostContext(f) } });
    else if (m.method === "ui/notifications/initialized") { f.ready = true; post(f, "ui/notifications/tool-input", { arguments: f.args }); if (f.result) post(f, "ui/notifications/tool-result", f.result); }
    else if (m.method === "ui/notifications/size-changed") {
      const h = Math.max(48, Math.ceil(p.height || 0)), stick = nearBottom() && !f.pinned && !busy;
      f.iframe.style.height = h + "px";
      if (stick && !replay) log.scrollTop = log.scrollHeight;
    }
    else if (m.method === "tools/call") answer({ result: await rpc("tools/call", { name: p.name, arguments: p.arguments || {} }) });
    else if (m.method === "resources/read") answer({ result: await rpc("resources/read", p) });
    else if (m.method === "ui/open-link") { const w = window.open(p.url, "_blank", "noopener"); answer(w === null && !/^https?:/.test(p.url) ? { error: { code: -32000, message: "blocked" } } : { result: {} }); }
    else if (m.method === "ui/message") { answer({ result: {} }); const text = (p.content || []).map(c => c.text || "").join(" ").trim(), label = String((p._meta || {})["fi.valioaimo/label"] || "").trim().slice(0, 120); if (text) send(text, null, label); }
    else if (m.method === "ui/update-model-context") answer({ result: {} });
    else if (m.method === "ui/download-file") {
      for (const c of p.contents || []) { const r = c.resource || {}; const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([r.text || ""], { type: r.mimeType || "text/plain" })); a.download = String(r.uri || "file").split("/").pop(); document.body.appendChild(a); a.click(); a.remove(); }
      answer({ result: {} });
    }
    else if (m.method === "ping") answer({ result: {} });
    else answer({ error: { code: -32601, message: "Method not found" } });
  } catch (e) { answer({ error: { code: -32000, message: String(e.message || e) } }); }
});

// ---------------------------------------------------------------- the shop around it
const BOX = '<svg viewBox="0 0 18 18" aria-hidden="true"><path d="M3 6.2L9 3l6 3.2v5.6L9 15l-6-3.2zM3 6.2l6 3.1 6-3.1M9 9.3V15" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>';
function shop() {
  const a = (hello || {}).account || {};
  $("#acct").textContent = a.name || " ";
  $("#custno").textContent = a.customer ? `${t("custno")} ${a.customer}` : " ";
  const n = (hello || {}).proposals || 0, w = (hello || {}).waiting || 0, o = (hello || {}).orders || 0;
  $("#propn").hidden = !n; $("#propn").textContent = n;
  if (!ordersData) { $("#apprn").hidden = !w; $("#apprn").textContent = w; $("#ordn").hidden = !o; $("#ordn").textContent = o; }
  const ps = (hello || {}).products;
  $("#shelf").innerHTML = !ps ? Array.from({ length: 4 }, () => `<div class="tile sk"><div class="im"></div><b>&nbsp;</b><span class="pr">&nbsp;</span></div>`).join("")
    : !ps.length ? `<p class="muted" style="font-size:var(--t3)">${esc(t("shelf_none"))}</p>`
    : ps.map(p => `<button type="button" class="tile" data-again="${esc(p.id)}" data-title="${esc(p.title)}"><span class="im${p.picture ? "" : " none"}">${p.picture ? `<img src="${esc(p.picture)}" alt="" loading="lazy">` : BOX}</span><b>${esc(p.title)}</b><span class="pr">${esc(p.price_text || "")}</span><span class="go">${esc(t("again"))}</span></button>`).join("");
}
async function loadHello() {
  try { hello = await backend.hello(); } catch (e) { hello = null; }
  if (hello && hello.card_token && !Object.keys(tools).length) rpc("tools/list", {}).then(tl => { for (const x of tl.tools) tools[x.name] = x; }).catch(() => {});
  shop(); greet();
}
function view(v) {
  $("#main").dataset.view = v;
  const cur = { shop: "shelf", chat: "order", orders: "orders", approvals: "approvals" }[v];
  for (const b of $$("[data-tab]")) b.setAttribute("aria-current", String(b.dataset.tab === cur));
  if (v === "chat") requestAnimationFrame(() => { if (!busy && !Object.keys(turns).length) log.scrollTop = log.scrollHeight; });
  if (v === "orders" || v === "approvals") { panel(v); counts(); }
}

// ---- input
const ta = $("#text"), fileIn = $("#file");
let image = null;
function syncCompose() { $("#send").disabled = false; }
function grow() { ta.style.height = "auto"; ta.style.height = Math.min(140, ta.scrollHeight) + "px"; }
ta.addEventListener("input", grow);
ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing && !matchMedia("(pointer:coarse)").matches) { e.preventDefault(); $("#compose").requestSubmit(); } });
$("#compose").addEventListener("submit", e => {
  e.preventDefault();
  const text = ta.value, img = image;
  if (!text.trim() && !img) return;
  ta.value = ""; grow(); setImage(null);
  send(text, img);
});
$("#photo").onclick = () => fileIn.click();
fileIn.onchange = async () => { const f = fileIn.files[0]; fileIn.value = ""; if (f) setImage(await shrink(f)); };
$("#unatt").onclick = () => setImage(null);
function setImage(d) { image = d; $("#att").hidden = !d; if (d) $("#att img").src = d; }
async function shrink(file, max = 1600) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.85);
  } finally { URL.revokeObjectURL(url); }
}

// ---- clicks anywhere on the page
document.addEventListener("click", async e => {
  if (e.target.closest("[data-new]")) { fresh(); return; }
  const ab = e.target.closest("[data-act]"), ce = ab && ab.closest(".cart[data-cid]");
  if (ab && ce && carts[ce.dataset.cid]) { cartAct(carts[ce.dataset.cid], ab); return; }
  const ag = e.target.closest("[data-again]");
  if (ag) { if (!busy) act({ type: "again", product: ag.dataset.again, ...(ag.dataset.asked ? { asked: true } : {}) }, ag.dataset.asked ? ag.textContent : t("again_l")(ag.dataset.title)); else view("chat"); return; }
  const cf = e.target.closest("[data-confirm]");
  if (cf) { if (!busy) act({ type: "confirm", checkout: cf.dataset.confirm }, t("c").confirm); return; }
  const cu = e.target.closest("[data-copyurl]");
  if (cu) { const u = cu.dataset.copyurl; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => { cu.textContent = t("c").copied; }).catch(() => { prompt(t("c").copy, u); }); return; }
  const s = e.target.closest("[data-say]");
  if (s) { e.preventDefault(); view("chat"); if (s.dataset.img) sample(s.dataset.say, s.dataset.img); else send(s.dataset.say); return; }
  const tb = e.target.closest("[data-tab]");
  if (tb) { const k = tb.dataset.tab; if (k === "order") view("chat"); else if (k === "shelf") view("shop"); else if (k === "orders" || k === "approvals") view(k); else { view("chat"); send(t("tabmsg")[k]); } return; }
  const lb = e.target.closest("[data-lang]");
  if (lb && lb.dataset.lang !== lang) {
    lang = lb.dataset.lang; window.LANG_FROM_BROWSER = false; try { localStorage.setItem("shop.lang", lang); } catch (err) {}
    paint(); shop(); setStatus(statusKey); recap();
    for (const k of Object.keys(carts)) if (carts[k].el.isConnected) render(carts[k]);
    for (const f of frames) if (f.ready) post(f, "ui/notifications/host-context-changed", { locale: loc() });
    const v = $("#main").dataset.view; if (v === "orders" || v === "approvals") panel(v);
    await loadHello(); quick(); return;
  }
  if (e.target.closest("[data-retry]") && lastUser && !busy) { e.target.closest(".err").remove(); const [a, b, c] = lastUser; send(a, b, c); return; }
  if (e.target.closest("[data-retry-hello]")) { loadHello(); return; }
});
for (const f of $$("[data-search]")) f.addEventListener("submit", e => { e.preventDefault(); const q = f.q.value.trim(); if (!q) return; f.q.value = ""; view("chat"); send(t("find")(q)); });
async function fresh() {
  if (busy) return;
  await backend.reset();
  thread = null; after = 0; keep(); frames.length = 0; drawnTurns.clear(); lastUser = null;
  for (const k of Object.keys(carts)) { clearTimeout(carts[k].timer); delete carts[k]; }
  for (const k of Object.keys(turns)) delete turns[k];
  log.innerHTML = ""; greetEl = null;
  await loadHello(); quick();
}
$("#reset").onclick = fresh;
addEventListener("resize", () => { for (const f of frames) if (f.ready) post(f, "ui/notifications/host-context-changed", { containerDimensions: { width: f.iframe.clientWidth, maxHeight: 8000 }, platform: innerWidth < 700 ? "mobile" : "web" }); });

// ---------------------------------------------------------------- start
paint(); shop(); syncCompose();
cardReady().catch(() => {});
(async () => {
  await loadHello();
  try { thread = sessionStorage.getItem(KEY); } catch (e) {}
  if (thread) { busy = true; replay = true; await poll(); replay = false; requestAnimationFrame(() => { log.scrollTop = log.scrollHeight; }); }
  else thread = null;
  counts();
})();
</script>
</body>
