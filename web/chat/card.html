<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Valio Aimo order card</title>
<!--
  One self-contained file: the card a chat draws under each tool call of the Valio Aimo agent gateway (MCP Apps, SEP-1865).
  No network, no libraries: everything it shows arrives in the tool result over postMessage, and it talks back the same way.
  Signatures are checked here, in the frame, with WebCrypto. Source: web/chat/card.html in the public repo.
-->
<style>
:root{color-scheme:light dark;
  --d-bg:#fff;--d-bg2:#f5f5f3;--d-bg3:#ecebe8;--d-tx:#141413;--d-tx2:#5c5b57;--d-tx3:#8b8a84;
  --d-line:rgba(20,20,19,.11);--d-line2:rgba(20,20,19,.26);--d-ok:#1a7a43;--d-warn:#8a5a00;--d-bad:#b42318}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --d-bg:#1f1e1d;--d-bg2:#292826;--d-bg3:#33322f;--d-tx:#f4f3ee;--d-tx2:#b9b7ae;--d-tx3:#8d8b83;
  --d-line:rgba(244,243,238,.12);--d-line2:rgba(244,243,238,.28);--d-ok:#6fd195;--d-warn:#e8b964;--d-bad:#f2918a}}
:root[data-theme="dark"]{
  --d-bg:#1f1e1d;--d-bg2:#292826;--d-bg3:#33322f;--d-tx:#f4f3ee;--d-tx2:#b9b7ae;--d-tx3:#8d8b83;
  --d-line:rgba(244,243,238,.12);--d-line2:rgba(244,243,238,.28);--d-ok:#6fd195;--d-warn:#e8b964;--d-bad:#f2918a}
:root{
  --bg:var(--color-background-primary,var(--d-bg));--bg2:var(--color-background-secondary,var(--d-bg2));--bg3:var(--color-background-tertiary,var(--d-bg3));
  --tx:var(--color-text-primary,var(--d-tx));--tx2:var(--color-text-secondary,var(--d-tx2));--tx3:var(--color-text-tertiary,var(--d-tx3));
  --line:var(--color-border-secondary,var(--d-line));--line2:var(--color-border-primary,var(--d-line2));
  --ok:var(--color-text-success,var(--d-ok));--warn:var(--color-text-warning,var(--d-warn));--bad:var(--color-text-danger,var(--d-bad));
  --sans:var(--font-sans,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif);
  --mono:var(--font-mono,ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace)}
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{font:400 13.5px/1.45 var(--sans);color:var(--tx);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums;padding:1px}
h1,h2,p,ul,figure{margin:0;padding:0}
ul{list-style:none}
button{font:inherit;color:inherit}
.card{border:1px solid var(--line);border-radius:14px;background:var(--bg);overflow:hidden;min-width:0}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px 0}
.brand{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--tx2);white-space:nowrap;min-width:0}
.brand i{width:7px;height:7px;border-radius:2px;background:var(--tx);flex:none}
.brand span{font-weight:400;color:var(--tx3);overflow:hidden;text-overflow:ellipsis}
.tt{padding:7px 16px 14px}
.tt h1{font-size:17px;line-height:1.25;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.tt p{margin-top:3px;color:var(--tx2);font-size:13px}
.sec{border-top:1px solid var(--line);padding:13px 16px}
.lab{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--tx3);margin-bottom:8px}
.mut{color:var(--tx2)}.dim{color:var(--tx3)}.sm{font-size:12.5px}.xs{font-size:11.5px}
.m{font-family:var(--mono);font-size:11.5px;letter-spacing:-.01em;overflow-wrap:anywhere}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;line-height:1.5;padding:1px 8px 1px 7px;border-radius:999px;border:1px solid var(--line2);white-space:nowrap;flex:none}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok,.chip.warn,.chip.bad{border-color:color-mix(in srgb,currentColor 38%,transparent)}
.pill{display:inline-block;font-size:11.5px;line-height:1.5;padding:0 7px;border-radius:6px;background:var(--bg2);color:var(--tx2);margin:0 4px 4px 0}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 13px;border-radius:8px;border:1px solid var(--tx);background:var(--tx);color:var(--bg);font-weight:600;font-size:13px;line-height:1;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--tx);border-color:var(--line2)}
.btn:disabled{opacity:.45;cursor:default}
.btn:active:not(:disabled){transform:translateY(1px)}
.lnk{appearance:none;background:none;border:0;padding:0;color:var(--tx2);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:2.5px;cursor:pointer;font-size:inherit}
.btn:focus-visible,.lnk:focus-visible,summary:focus-visible{outline:2px solid var(--tx);outline-offset:2px;border-radius:6px}
@media (pointer:coarse){.btn{height:44px;padding:0 16px;font-size:14px}details>summary{min-height:44px;display:flex;align-items:center}.chk summary{align-items:center}.lnk{min-height:44px}}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ic{width:16px;height:16px;flex:none;display:inline-grid;place-items:center;vertical-align:-3px}
.ic svg{width:16px;height:16px;display:block}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
summary .car{display:inline-block;width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);margin:0 2px 1px 6px;opacity:.7;transition:transform .15s}
details[open]>summary .car{transform:rotate(45deg)}

/* options of a plan */
.opt{border-top:1px solid var(--line);padding:13px 16px 14px}
.o-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tag{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--tx2)}
.price{font-size:15px;font-weight:600;white-space:nowrap}
.price small{font-size:11.5px;font-weight:400;color:var(--tx3);margin-left:3px}
.o-line{display:flex;justify-content:space-between;gap:12px;margin-top:3px;font-size:14px;font-weight:500;line-height:1.35}
.o-line .per{font-size:12.5px;font-weight:400;color:var(--tx2);white-space:nowrap}
.o-sub{font-size:12.5px;color:var(--tx2);margin-top:2px}
.cov{display:flex;align-items:center;gap:9px;margin-top:9px;font-size:12.5px;color:var(--tx2)}
.bar{flex:1;height:4px;border-radius:2px;background:var(--bg3);overflow:hidden;min-width:40px;display:flex}
.bar i{display:block;height:100%;background:var(--tx)}
.bar i.b2{background:var(--tx3)}
.bar.short i{background:var(--warn)}
.trade{font-size:12.5px;color:var(--tx2);margin-top:8px}
.o-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:10px}
.why{font-size:12.5px;min-width:0}
.why summary{font-weight:600}
.why ul{margin-top:5px;color:var(--tx2);font-weight:400}
.why li{margin-top:3px;padding-left:10px;text-indent:-10px}
.why li::before{content:"· "}
.way{border-top:1px solid var(--line);margin-top:12px;padding-top:11px}
.way .a{font-size:14px;font-weight:500;line-height:1.35}
.fold.ways{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.notes{font-size:12.5px;color:var(--tx2)}
.notes>*+*{margin-top:7px}
.rows{margin-top:8px}
.rw{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px}
.rw:first-child{border-top:0}
.rw b{font-weight:500;color:var(--tx)}
.rw .r{text-align:right;white-space:nowrap}

/* lines, totals, facts */
.li{display:grid;grid-template-columns:1fr auto;gap:1px 12px;padding:9px 0;border-top:1px solid var(--line)}
.li:first-of-type{border-top:0;padding-top:0}
.li:last-of-type{padding-bottom:0}
.li .a{font-size:14px;font-weight:500;line-height:1.35}
.li .a .q{font-weight:600}
.li .p{font-size:14px;font-weight:600;white-space:nowrap;text-align:right}
.li .f{grid-column:1/-1;font-size:12px;color:var(--tx2);line-height:1.5}
.li .f s{color:var(--tx3)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--tx2)}
.kv dd{margin:0;text-align:right;min-width:0}
.tots>div{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:2px 0}
.tots>div>span:first-child{color:var(--tx2)}
.tots .tot{font-weight:600;font-size:14.5px;padding-top:8px;border-top:1px solid var(--line);margin-top:6px}
.tots .tot>span:first-child{color:var(--tx)}
.kv.left dd{text-align:left}

/* rules and checks */
.rules li{display:flex;gap:9px;padding:5px 0;font-size:13px;align-items:flex-start}
.rules .ic{margin-top:1.5px}
.rules b{font-weight:600}
.rules p{color:var(--tx2);font-size:12.5px;margin-top:1px}
.rid{font-family:var(--mono);font-size:10.5px;color:var(--tx3);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:5px;vertical-align:1px}
.fold{font-size:12.5px;color:var(--tx2);margin-top:6px}
.fold[open] summary{margin-bottom:2px}
.chk{border-top:1px solid var(--line)}
.chk:first-of-type{border-top:0}
.chk summary{display:flex;gap:9px;align-items:flex-start;padding:7px 0;font-size:13px;font-weight:500}
.chk summary .ic{margin-top:1.5px}
.chk p{font-size:12.5px;color:var(--tx2);padding:0 0 9px 25px}
.chk.fail summary{color:var(--bad)}
.chk .soft{font-weight:400;color:var(--tx3)}

/* the hand-off to a second person */
.hand{display:flex;gap:14px;align-items:flex-start}
.qr{flex:none;width:104px;height:104px;border-radius:8px;background:#fff;padding:4px;border:1px solid var(--line)}
.qr svg{display:block;width:100%;height:100%}
.hand .tx{min-width:0;flex:1}
.hand .tx p{font-size:13px}
.hand .acts{margin-top:10px}
.live{display:flex;align-items:center;gap:8px;margin-top:11px;font-size:12.5px;color:var(--tx2)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none;animation:pu 1.6s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.done{display:flex;gap:9px;align-items:flex-start;font-size:13.5px}
.done b{font-weight:600}
@media (max-width:420px){.hand{flex-direction:column}.qr{width:132px;height:132px}}

/* payment, peppol, signature line */
.meter{margin-top:9px}
.meter .bar{height:6px;border-radius:3px}
.meter p{font-size:12px;color:var(--tx2);margin-top:5px}
.sig{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--tx2);padding:10px 16px;border-top:1px solid var(--line)}
.sig .ic{margin-top:1px}
.sig.fail{color:var(--bad)}
pre{margin:9px 0 0;padding:10px 11px;border-radius:8px;background:var(--bg2);font:400 11px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--tx2);max-height:none}
pre .t{color:var(--tx3)}
pre.raw{max-height:340px;overflow:auto}
.amt-bad{color:var(--bad);font-weight:600}
.ft{border-top:1px solid var(--line);padding:9px 16px 10px;font-size:11.5px;color:var(--tx3);background:var(--bg2)}
.ft summary{display:flex;justify-content:space-between;gap:10px;align-items:center}
.ft .note{margin-top:0}
.ft .checks>summary{cursor:pointer}
.chkb{margin-top:8px;color:var(--tx2);font-size:12.5px}
.chkb>*+*{margin-top:10px}
.chkb .sig{padding:8px 0;border-top:0}
.chkb .sec{padding:10px 0;border-top:1px solid var(--line)}
.whyp p{font-size:14px;color:var(--tx)}
.whyp p+p{margin-top:5px}
.rw.us .acts{display:flex}
.rw.us .btn{height:32px;font-size:12.5px;padding:0 12px}
@media (pointer:coarse){.rw.us .btn{height:44px}}
.toast{position:sticky;bottom:0;margin:0 16px 10px;padding:7px 10px;border-radius:8px;background:var(--tx);color:var(--bg);font-size:12.5px;text-align:center}
.sk{height:10px;border-radius:5px;background:var(--bg3);margin:9px 0;animation:sh 1.3s ease-in-out infinite}
.sk.w6{width:62%}.sk.w4{width:41%}
@keyframes sh{0%,100%{opacity:1}50%{opacity:.45}}
.prod{border-top:1px solid var(--line);padding:12px 16px}
.prod .f{font-size:12.5px;color:var(--tx2);margin-top:5px}
.prod .f b{font-weight:600;color:var(--tx)}
.prod .claims{margin-top:7px}
h2{font-size:14.5px;font-weight:600;line-height:1.3;margin-top:3px}
/* a product's picture, or a plain tile where no public picture exists */
.th{flex:none;width:40px;height:40px;border-radius:8px;background:#fff;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;color:var(--tx3)}
.th img{width:100%;height:100%;object-fit:contain;display:block}
.th.none{background:var(--bg2)}
.th.none svg{width:18px;height:18px;display:block}
.th.lg{width:52px;height:52px}
.wp{display:flex;gap:11px;align-items:flex-start;min-width:0}
.wp>.bd{flex:1;min-width:0}
.wp .o-line{margin-top:0}
.rw.pi{align-items:center}
.rw.pi>span:nth-child(2){flex:1;min-width:0}
.li.pi{grid-template-columns:auto 1fr auto}
.li.pi .th{grid-row:1/span 2}
.li.pi .f{grid-column:2/-1}
/* an answer with nothing in it: one line, not a card */
.one{display:flex;align-items:center;gap:8px;padding:8px 13px;border:1px solid var(--line);border-radius:10px;font-size:12.5px;color:var(--tx2);background:var(--bg)}
.one i{width:6px;height:6px;border-radius:2px;background:var(--tx3);flex:none}
.start{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.start .btn{height:30px;font-size:12.5px;font-weight:500;padding:0 10px}
@media (pointer:coarse){.start .btn{height:44px;font-size:13px}}
@media (max-width:480px){.ft summary{flex-direction:column;align-items:flex-start;gap:3px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* a fold whose summary says one thing closed and another open */
.sw-o{display:none}
details[open]>summary .sw-c{display:none}
details[open]>summary .sw-o{display:inline}
.more-lines{margin-top:9px;padding-top:2px}
.more-lines>summary{font-size:12.5px;font-weight:600;color:var(--tx2)}
.more-lines .li:first-of-type{border-top:1px solid var(--line);padding-top:9px}
.rank{font-size:12.5px;color:var(--tx2);margin-top:3px}
.rank b{font-weight:600;color:var(--tx)}
.sec.fold{margin-top:0;color:var(--tx)}
.sec.fold>summary{font-size:12.5px;font-weight:600;color:var(--tx2)}
.sec.fold[open]>summary{margin-bottom:8px}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sum .big{font-size:17px;font-weight:600;white-space:nowrap}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
(() => {
"use strict";
const app = document.getElementById("app");
const S = { host: null, ctx: {}, input: null, res: null, d: null, x: {}, tool: "", open: {}, tamper: false, xml: false, live: {}, toast: "", checks: null, sig: {}, lang: "en" };

// ------------------------------------------------------------------ language: the host's locale picks it (fi-* = Finnish, anything else = English as before)
const fi = () => S.lang === "fi";
const L = (en, f) => fi() ? f : en;
const phone = () => S.ctx.platform === "mobile";

// ------------------------------------------------------------------ words and numbers
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = (n, lo = 0, hi = 2) => Number(n).toLocaleString(fi() ? "fi-FI" : "en-US", { minimumFractionDigits: lo, maximumFractionDigits: Math.max(lo, hi) });
const eur = c => (c < 0 ? "−" : "") + (fi() ? nf(Math.abs(c) / 100, 2) + " €" : "€" + nf(Math.abs(c) / 100, 2));
const TZ = "Europe/Helsinki";
const fixIso = s => String(s).replace(/([+-]\d\d)(\d\d)$/, "$1:$2");
const day = s => { try { const d = new Date(String(s).length === 10 ? s + "T12:00:00Z" : fixIso(s)), tz = String(s).length === 10 ? "UTC" : TZ; if (isNaN(d)) return String(s); return fi() ? d.toLocaleDateString("fi-FI", { weekday: "short", day: "numeric", month: "numeric", timeZone: tz }) : d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", timeZone: tz }).replace(/,/g, ""); } catch (e) { return String(s); } };
const dayTime = s => { try { const d = new Date(fixIso(s)); if (isNaN(d)) return String(s); return fi() ? d.toLocaleString("fi-FI", { weekday: "short", day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit", timeZone: TZ }) : d.toLocaleString("en-GB", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: TZ }).replace(/,/g, ""); } catch (e) { return String(s); } };
const clock = s => { try { const d = new Date(fixIso(s)); if (isNaN(d)) return String(s); return d.toLocaleTimeString(fi() ? "fi-FI" : "en-GB", { hour: "2-digit", minute: "2-digit", timeZone: TZ }); } catch (e) { return String(s); } };
const left = s => { const ms = new Date(fixIso(s)) - Date.now(); if (!(ms > 0)) return L("passed", "ohi"); const m = Math.floor(ms / 60000), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60); return fi() ? (d ? `${d} pv ${h} h aikaa` : h ? `${h} h ${m % 60} min aikaa` : `${Math.max(1, m)} min aikaa`) : d ? `${d} d ${h} h left` : h ? `${h} h ${m % 60} min left` : `${Math.max(1, m)} min left`; };
const until = s => `<span data-left="${esc(s)}">${left(s)}</span>`;
const country = c => { try { return new Intl.DisplayNames([fi() ? "fi" : "en"], { type: "region" }).of(c) || c; } catch (e) { return c; } };
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const LABELS = { GOODS_FROM_FINLAND_BLUE_SWAN: "Hyvää Suomesta", EU_ORGANIC_FARMING: "EU organic", KEY_FLAG: "Avainlippu", NORDIC_SWAN: "Nordic Swan" };
const claimEn = c => { const [k, v] = String(c).split(":"); if (v === undefined) return LABELS[c] || cap(String(c).toLowerCase().replace(/_/g, " ")); const w = v.toLowerCase().replace(/_/g, " "); return k === "FREE_FROM" ? cap(w) + " free" : cap(w); };
const CLAIM_FI = { "FREE_FROM:LACTOSE": "laktoositon", "FREE_FROM:GLUTEN": "gluteeniton", "DIET:FREE_FROM_GLUTEN": "gluteeniton", "FREE_FROM:MILK": "maidoton", "FREE_FROM:EGGS": "kananmunaton", "FREE_FROM:SOY": "soijaton", "FREE_FROM:NUTS": "pähkinätön",
  "FREE_FROM:WHEAT": "vehnätön", "DIET:VEGAN": "vegaaninen", "DIET:VEGETARIAN": "kasvis", "LOW:FAT": "vähärasvainen", "LOW:LACTOSE": "vähälaktoosinen", "LOW:SODIUM_SALT": "vähäsuolainen", "LOW:SUGARS": "vähäsokerinen", "NO_ADDED:SUGARS": "ei lisättyä sokeria",
  "NO_ADDED:SALT": "ei lisättyä suolaa", "FREE_FROM:ADDITIVES": "ei lisäaineita", "FREE_FROM:PRESERVATIVES": "ei säilöntäaineita", "FREE_FROM:SWEETENERS": "ei makeutusaineita", "FREE_FROM:COLOURING_AGENTS": "ei väriaineita", "HIGH:PROTEIN": "runsasproteiininen",
  "HIGH:FIBRE": "runsaskuituinen", "SOURCE_OF:PROTEIN": "proteiinin lähde", "SOURCE_OF:FIBRE": "kuidun lähde", GOODS_FROM_FINLAND_BLUE_SWAN: "Hyvää Suomesta", EU_ORGANIC_FARMING: "EU-luomu", KEY_FLAG: "Avainlippu", NORDIC_SWAN: "Joutsenmerkki" };
const claim = c => fi() && CLAIM_FI[c] ? cap(CLAIM_FI[c]) : claimEn(c);
// The gateway words its notes for the assistant: claim codes and tool names. A person reads the same sentence without them.

      + `<section class="sec"><p class="lab">${fi() ? `Ennen tilausta on kysyttävä ${qs.length === 1 ? "yksi asia" : qs.length + " asiaa"}` : `Code found ${qs.length === 1 ? "one thing" : qs.length + " things"} to ask before ordering`}</p><ul class="rules">${qs.map(q => `<li>${IC.warn}<div><p style="color:var(--tx)">${esc(tr(q.text))}</p></div></li>`).join("")}</ul><p class="sm mut" style="margin-top:6px">${L("Answer in the chat. Nothing is ordered until then.", "Vastaa keskustelussa. Mitään ei tilata sitä ennen.")}</p></section>` + sig);
  }
  const ls = d.lines || [], subs = ls.filter(l => l.substitutes_for), no = d.not_ordered || [], pantry = d.pantry || [];
  const forOf = l => [...new Set((l.for || []).map(f => dish(f.dish)))].join(", ");
  const row = l => `<div class="li pi">${pic(l.product.id)}<div class="a"><span class="q">${nf(l.units, 0, 2)} ${esc(uw(l.unit, l.units))}</span> ${esc(l.product.title)}</div><div class="p">${eur(l.amount)}</div>${forOf(l) || l.partial ? `<div class="f">${forOf(l) ? L("For ", "Ruokaan: ") + esc(forOf(l)) : ""}${l.partial ? `${forOf(l) ? " · " : ""}<span class="warn">${L("less than the menu needs is in stock", "varastossa vähemmän kuin menu tarvitsee")}</span>` : ""}</div>` : ""}</div>`;
  // A replacement says why, what changes for the kitchen (price, fat, brand) and that it is Valio Aimo's own range at this account's price.
  const sub = l => `<div class="li pi">${pic(l.product.id)}<div class="a">${esc(l.product.title)} <span class="dim sm">${L("in place of", "korvaa tuotteen")} ${esc(l.substitutes_for.title)}</span></div><div class="p">${eur(l.amount)}</div><div class="f">${[l.reason, l.tradeoff, l.from_range].filter(Boolean).map(t => esc(tr(t))).join(" ")}</div></div>`;
  const nope = o => { const t = fi() && o.dish && o.item ? `${cap(ing(o.item))}, ${dish(o.dish)}` : fi() ? dish(o.dish) || ing(o.item) || "" : o.dish && o.item ? o.item + ", " + o.dish : o.dish || o.item || ""; return `<li>${IC.warn}<div><b>${esc(cap(t))}</b>${o.amount ? ` <span class="dim">${esc(fQ(o.amount))}</span>` : ""}<p>${esc(tr(o.text || ""))}</p></div></li>`; };
  const checked = ds.filter(x => /check it/.test(x.recipe || ""));
  const notes = [];
  if (d.budget) notes.push(`<p${d.budget.fits ? "" : ' class="bad"'}><b>${d.budget.fits ? L("Within the budget.", "Budjetin sisällä.") : L("Over the budget.", "Yli budjetin.")}</b> ${esc(tr(d.budget.text || ""))}</p>`);
  for (const w of d.warnings || []) notes.push(`<p class="bad"><b>${L("Severe allergy.", "Vakava allergia.")}</b> ${esc(tr(w.text))}</p>`);
  for (const f of d.flags || []) notes.push(`<p class="warn"><b>${L("Check this recipe.", "Tarkista resepti.")}</b> ${esc(tr(f.text))}</p>`);
  if (checked.length) notes.push(`<p>${esc(checked.map(x => dish(x.name)).join(", "))}: ${L("no recipe card in this kitchen, so a model proposed the recipe. Check it.", "keittiöllä ei ole tälle reseptikorttia, joten kielimalli ehdotti reseptin. Tarkista se.")}</p>`);
  if ((d.diet || []).length) { const ws = [...new Set(d.diet.map(r => r.note))]; notes.push(`<p>${fi() ? "Ruokavaliot: " + esc(ws.map(w => DIET_FI[String(w).toLowerCase()] || w).join(", ")) : "Diet applied: " + esc(ws.join(", "))}.</p>`); }
  const ready = d.status === "ready" && ls.length;
  const text = `Make the order from this menu plan: ${T.lines} lines, €${((T.subtotal || 0) / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ex VAT, delivery ${dayEn(d.delivery_date)}.`;
  const nL = T.lines || ls.length;
  return wrap(head(fi() ? `${nf(nL)} tilausrivi${nL === 1 ? "" : "ä"} · ${eur(T.subtotal || 0)}` : `${nf(nL)} order line${nL === 1 ? "" : "s"} · ${eur(T.subtotal || 0)}`, what, no.length ? chip("warn", L(`${no.length} for a person`, `${no.length} päätettävää`)) : chip("ok", L("Checked in code", "Tarkistettu")))
    + `<section class="sec"><dl class="kv left"><dt>${L("Delivery", "Toimitus")}</dt><dd>${day(d.delivery_date)}${d.delivery_note ? ` <span class="dim sm">· ${esc(String(tr(d.delivery_note)).replace(/\.$/, ""))}</span>` : ""}</dd><dt>${L("Total", "Yhteensä")}</dt><dd>${eur(T.subtotal || 0)} <span class="dim sm">${L("ex VAT", "alv 0 %")}</span></dd></dl>
       ${ready ? `<div class="acts" style="margin-top:12px">${sayBtn("", text, L("Make the order from this menu", "Tee tilaus tästä menusta"), L("Make the order", "Tee tilaus"))}<span class="xs dim" style="flex:1;min-width:150px">${L("Valio Aimo signs an offer and the rules run again before anything is ordered.", "Valio Aimo kokoaa ostoskorin, ja säännöt tarkistetaan uudelleen ennen tilausta.")}</span></div>` : `<p class="sm mut" style="margin-top:10px">${L("Nothing on this menu can be ordered as it stands.", "Tästä menusta ei voi tilata mitään näin.")}</p>`}</section>`
    + (subs.length ? `<section class="sec"><p class="lab">${L("Replaces a short product", "Korvaa loppuneen tuotteen")}</p>${subs.map(sub).join("")}</section>` : "")
    + (no.length ? `<section class="sec"><p class="lab">${L("Not ordered, a person decides", "Ei tilattu, päätä itse")}</p><ul class="rules">${no.map(nope).join("")}</ul></section>` : "")
    + (ls.length ? `<section class="sec">${fold("menulines", L(`All ${ls.length} lines`, `Kaikki ${ls.length} riviä`), `<div style="margin-top:9px">${ls.map(row).join("")}</div>`, "fold")}${pantry.length ? `<p class="sm mut" style="margin-top:8px">${L("Left to your own pantry, not ordered: ", "Omasta varastostasi, ei tilattu: ")}${esc(pantry.map(x => `${ing(x.item)} ${fQ(x.amount)}`).join(", "))}.</p>` : ""}</section>` : "")
    + (notes.length ? `<section class="sec notes">${notes.join("")}</section>` : "")
    + sig);
}
function vOther(d) {
  if (inShop() && d.proposal) { const st = d.proposal.status; return vProposals({ proposals: [d.proposal] }, st === "declined" ? L("Proposal declined", "Ehdotus hylätty") : st === "accepted" ? L("Proposal accepted", "Ehdotus hyväksytty") : L("Proposal", "Ehdotus")); }
  const ms = (d.messages || []).map(m => m.content).concat(d.message ? [d.message] : []).filter(Boolean).map(tr);
  const facts = fi() ? [] : Object.entries(d).filter(([k, v]) => !["ucp", "proof", "messages", "message"].includes(k) && v !== null && typeof v !== "object").slice(0, 8);
  return wrap(head(fi() ? "Vastaus" : esc(cap(String(S.tool || "Answer").replace(/_/g, " "))), "", d.status ? `<span class="chip">${esc(status(d.status))}</span>` : "")
    + `<section class="sec">${ms.map(m => `<p style="margin-bottom:6px">${esc(m)}</p>`).join("")}${facts.length ? `<dl class="kv left">${facts.map(([k, v]) => `<dt>${esc(cap(k.replace(/_/g, " ")))}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : ""}${!ms.length && !facts.length ? `<p class="mut">${L("The full answer is below.", "Koko vastaus on alla.")}</p>` : ""}</section>` + (d.proof ? sigLine("doc", "signed") : ""));
}

// ------------------------------------------------------------------ state
const kindOf = d => !d ? "none" : (d.ucp || {}).status === "error" ? "error" : (Array.isArray(d.lines) && Array.isArray(d.not_ordered)) || (d.reading && d.status === "needs_answers") || d.status === "not_a_menu" ? "menu" : d.checkout && d.card ? "checkout" : d.order && d.card ? "order"
  : Array.isArray(d.options) && d.need ? "plan" : d.ap2 && d.id ? "checkout" : d.label && d.proof && (d.wholesale || {}).evidence ? "order"
  : Array.isArray(d.usual) ? "usual" : Array.isArray(d.products) ? "catalog" : Array.isArray(d.proposals) || d.type === "proposal" ? "proposals" : Array.isArray(d.issues) || d.what_happened ? "issues" : "other";
function take(res) {
  S.res = res;
  const meta = ((res && res._meta) || {})["fi.valioaimo/card"] || {};
  S.x = meta; S.tool = S.tool || meta.tool || "";
  S.d = meta.full || parse(res);
  if (res && res.isError && !S.d) S.d = { ucp: { status: "error" }, messages: [{ content: (((res.content || [])[0]) || {}).text || "The tool failed." }] };
  S.kind = kindOf(S.d);
  // Finnish product names: from the card's extras (names: {id: name}) and from catalog answers, whose variant description is the Finnish name.
  S.names = Object.assign({}, S.x.names || {});
  for (const p of (S.d && S.d.products) || []) { const v = ((p.variants || [])[0] || {}).description, n = v && v.plain; if (n && !/ · /.test(n) && n !== p.title) S.names[p.id] = n; }
  const titles = {};
  for (const p of (S.d && S.d.products) || []) if (S.names[p.id]) titles[p.title] = S.names[p.id];
  // every product the answer names anywhere (a proposal's lines, an offer's items): its English title is said by its Finnish name in a Finnish sentence
  (function walk(v, depth) {
    if (!v || typeof v !== "object" || depth > 7) return;
    if (!Array.isArray(v) && v.id != null && typeof v.title === "string" && S.names[v.id] && S.names[v.id] !== v.title) titles[v.title] = S.names[v.id];
    for (const k in v) if (k !== "proof" && k !== "ap2") walk(v[k], depth + 1);
  })(S.d, 0);
  S.titleFi = Object.entries(titles).sort((a, b) => b[0].length - a[0].length);
  if (S.kind === "checkout" && S.d.status === "completed" && S.x.order) { S.order = S.x.order; S.kind = "order"; }
  else if (S.kind === "order") S.order = S.d;
  S.checks = null; S.tamper = false;
  render();
  after();
}
function after() {
  // The assistant was handed the short answer and this chat kept the whole one from the card: ask the connector for it by its id.
  if (S.d && S.d.card && S.d.note && !S.x.full) { tool("card_data", { kind: "result", id: S.d.card }).then(r => { if (r && r.full) { S.res = Object.assign({}, S.res, { _meta: { "fi.valioaimo/card": Object.assign({ full: r.full }, r.card) } }); take(S.res); checkSigs(); } }).catch(() => {}); return; }
  if (S.kind === "order") {
    if (!S.x.audit) tool("card_data", { kind: "order", id: S.order.id }).then(r => { if (r && r.card) { S.x = Object.assign({}, S.x, r.card); render(); runChecks(); } }).catch(() => {});
    else runChecks();
  }
  if (S.kind === "checkout") {
    if (S.d.status === "completed" && S.d.order && S.tool === "complete_checkout") tool("card_data", { kind: "order", id: S.d.order.id }).then(r => { if (r && r.order) { S.order = r.order; S.x = Object.assign({}, S.x, r.card); S.kind = "order"; render(); runChecks(); } }).catch(() => {});
    else if (["requires_escalation", "ready_for_complete"].includes(S.d.status)) watch();
    // A host that keeps the result's _meta from the card: ask for the extras (QR, mandate, Valio Aimo's key) once.
    else if (!S.x.keys) tool("card_data", { kind: "checkout", id: S.d.id }).then(r => { if (r && r.card) { S.x = Object.assign({}, S.x, r.card); render(); checkSigs(); } }).catch(() => {});
  }
}
async function runChecks() {
  if (!subtle || !S.x.audit || !S.order) return;
  const o = S.tamper ? S.tampered : S.order;
  try { S.checks = await orderChecks(o, S.x.audit, (S.x.keys || {}).seller || S.x.audit.keys.seller); } catch (e) { S.checks = [[false, L("The checks could not run here", "Tarkistuksia ei voitu tehdä tässä"), String(e && e.message || e)]]; }
  render();
}
// A checkout that waits (for a person, or for the assistant to place it) is read again until it settles.
let timer = null, t0 = 0, misses = 0;
function stopWatch() { clearTimeout(timer); timer = null; }
function watch() {
  if (timer) return;
  S.live.stopped = false; t0 = Date.now(); misses = 0;
  const next = () => { const age = Date.now() - t0; if (age > 20 * 60000) { timer = null; S.live.stopped = true; render(); return; } timer = setTimeout(tick, age < 3 * 60000 ? 3000 : 8000); };
  const tick = async () => {
    timer = null;
    if (document.hidden) return next();
    try {
      const r = await tool("card_data", { kind: "checkout", id: S.d.id });
      if (r && r.checkout) {
        const was = S.d, c = r.checkout;
        S.live.at = new Date().toISOString();
        const changed = c.status !== was.status || jcs((c.wholesale || {}).approval || null) !== jcs((was.wholesale || {}).approval || null);
        const fresh = !S.x.keys && r.card && r.card.keys;  // the host kept _meta from the card: the first answer brings the extras
        S.d = c; S.x = Object.assign({}, S.x, r.card); misses = 0;
        // Draw again only when something changed: a redraw under a finger loses the tap.
        if (changed || fresh) { if (changed) settled(was, c); render(); if (fresh) checkSigs(); }
        else { const el = app.querySelector("[data-checked]"); if (el) el.textContent = L(", checked ", ", tarkistettu ") + clock(S.live.at); }
        if (!["requires_escalation", "ready_for_complete"].includes(c.status)) return;
      }
    } catch (e) { if (++misses >= 4) { S.live.stopped = true; render(); return; } }  // this chat does not let the card call the connector

  };
  next();
}
function settled(was, c) {
  const ap = (c.wholesale || {}).approval;
  if (was.status === "requires_escalation" && ap && ap.decision === "approved" && c.status === "ready_for_complete") {
    // The card never speaks for the person: it tells the assistant what changed and shows the button. The person presses it.
    tell(`Checkout ${c.id} was approved by ${ap.by} at ${clock(ap.at)}${ap.device ? " on their own device" : ""}. It is now ready_for_complete: when the user asks, call complete_checkout to place the order.`);
  } else if (ap && ap.decision === "rejected") tell(`Checkout ${c.id} was rejected by ${ap.by}${ap.note ? `: ${ap.note}` : ""}. Do not place it.`);
}

// ------------------------------------------------------------------ draw
function render() {
  let html;
  CHK = [];
  try {
    html = S.cancelled && !S.res ? `<div class="card">${head(L("Cancelled", "Peruttu"), esc(S.cancelled), "")}</div>` : !S.res ? vLoading()
      : S.kind === "error" ? vError(S.d) : S.kind === "plan" ? vPlan(S.d) : S.kind === "checkout" ? vCheckout(S.d.checkout && S.d.card ? S.d.checkout : S.d) : S.kind === "order" ? vOrder(S.order)
      : S.kind === "usual" ? vUsual(S.d) : S.kind === "catalog" ? vCatalog(S.d) : S.kind === "proposals" ? vProposals(S.d) : S.kind === "issues" ? vIssues(S.d) : S.kind === "menu" ? vMenu(S.d) : S.kind === "none" ? wrap(head(L("No answer to draw", "Ei näytettävää vastausta"), "", "")) : vOther(S.d);
  } catch (e) { html = wrap(head(L("This answer could not be drawn", "Tätä vastausta ei voitu näyttää"), esc(String(e && e.message || e)), "")); }
  app.innerHTML = html;
  for (const [id, v] of Object.entries(S.sig)) paintSig(id, v);

  requestAnimationFrame(size);
}
// A signature line's words, in the card's language at the time it is drawn.
function sigText(v) {
  const kid = v.kid ? L(` Key ${String(v.kid).slice(0, 12)}…`, ` Avain ${String(v.kid).slice(0, 12)}…`) : "", dg = String(v.digest || "").slice(0, 16);
  if (v.what === "offer") return v.ok === null ? L(`Offer signed by Valio Aimo (ES256), digest sha-256 ${dg}…. This frame cannot check it; the approval page can.`, `Valio Aimon allekirjoittama ostoskori (ES256), tiiviste sha-256 ${dg}…. Tässä näkymässä sitä ei voi tarkistaa; hyväksyntäsivu voi.`)
    : v.ok ? L(`Offer signed by Valio Aimo, checked here in the chat. Digest sha-256 ${dg}…: what the approver signs and what the order must match.${kid}`, `Valio Aimon allekirjoittama ostoskori, tarkistettu tässä keskustelussa. Tiiviste sha-256 ${dg}…: tämän hyväksyjä vahvistaa, ja tilauksen on vastattava sitä.${kid}`)
    : L("This offer does not match Valio Aimo's signature.", "Tämä ostoskori ei vastaa Valio Aimon allekirjoitusta.");
  return v.ok === null ? L("Signed by Valio Aimo (ES256). This frame cannot check signatures itself.", "Valio Aimon allekirjoittama (ES256). Tässä näkymässä allekirjoitusta ei voi tarkistaa.")
    : v.ok ? L(`Signed by Valio Aimo, checked here in the chat.${kid}`, `Valio Aimon allekirjoittama, tarkistettu tässä keskustelussa.${kid}`) : L("This answer does not match Valio Aimo's signature.", "Tämä vastaus ei vastaa Valio Aimon allekirjoitusta.");
}
function paintSig(id, v) {
  const el = app.querySelector(`[data-sig="${id}"]`);
  if (!el) return;
  el.classList.toggle("fail", v.ok === false);
  el.innerHTML = (v.ok ? IC.ok : v.ok === false ? IC.bad : IC.soft) + `<span>${esc(sigText(v))}</span>`;
}
async function checkSigs() {
  const d = S.d, seller = (S.x.keys || {}).seller;
  const set = (id, v) => { S.sig[id] = v; paintSig(id, v); requestAnimationFrame(size); };
  const kid = seller ? seller.kid : "";
  if (!d) return;
  if (S.kind === "checkout" && d.ap2) {
    if (!subtle || !seller) return set("offer", { ok: null, what: "offer", digest: d.ap2.checkout_digest });
    const c = S.d, ok = await verifyDetached(without(c, "ap2"), c.ap2.merchant_authorization, seller);
    set("offer", { ok, what: "offer", digest: c.ap2.checkout_digest, kid });
  } else if (d.proof && d.proof.jws) {
    if (!subtle || !seller) return set("doc", { ok: null, what: "doc" });
    const ok = await verifyDetached(without(d, "proof"), d.proof.jws, seller);
    set("doc", { ok, what: "doc", kid });
  }
}
app.addEventListener("toggle", e => { const k = e.target && e.target.dataset && e.target.dataset.k; if (k) { S.open[k] = e.target.open; requestAnimationFrame(size); } }, true);
app.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  if (act === "say") { b.disabled = true; const ok = await say(b.dataset.text, b.dataset.label); if (ok) toast(L("Sent to the chat.", "Lähetetty keskusteluun.")); else b.disabled = false; }
  else if (act === "open") openLink(b.dataset.url);
  else if (act === "copy") toast((await copy(b.dataset.text)) ? L("Link copied.", "Linkki kopioitu.") : b.dataset.text);
  else if (act === "watch") { watch(); render(); }
  else if (act === "xml") { S.xml = !S.xml; render(); }
  else if (act === "tamper") {
    S.tamper = !S.tamper;
    if (S.tamper) { S.tampered = JSON.parse(JSON.stringify(S.order)); const t = S.tampered.totals.find(x => x.type === "total"); t.amount += 1; }
    S.checks = null; render(); runChecks();
  }
  else if (act === "dl") {
    const pp = S.x.peppol, name = `${S.order.label}-peppol-order.xml`;
    try {
      if (!can("downloadFile")) throw new Error("no download");
      const r = await request("ui/download-file", { contents: [{ type: "resource", resource: { uri: `file:///${name}`, mimeType: "application/xml", text: pp.xml } }] }, 60000);
      if (r && r.isError) throw new Error("refused");
    } catch (err) {
      try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([pp.xml], { type: "application/xml" })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); if (!S.xml) { S.xml = true; render(); } }
      catch (e2) { openLink(pp.url); }
    }
  }
});
setInterval(() => { for (const el of app.querySelectorAll("[data-left]")) el.textContent = left(el.dataset.left); }, 30000);
try { new ResizeObserver(() => requestAnimationFrame(size)).observe(document.body); } catch (e) {}
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.kind === "checkout" && !timer && S.d && ["requires_escalation", "ready_for_complete"].includes(S.d.status) && !S.live.stopped) watch(); });

(async () => {
  render();
  try {
    S.host = await request("ui/initialize", { protocolVersion: "2026-01-26", appInfo: { name: "valio-aimo-cards", version: "1.0.0" }, appCapabilities: { availableDisplayModes: ["inline"] } }, 30000);
    applyCtx(S.host.hostContext || {});
    render();
  } catch (e) {}
  notify("ui/notifications/initialized");
  // ChatGPT's older bridge hands the result over on a global; use it if the standard notification has not come.
  setTimeout(() => { const o = window.openai; if (!S.res && o && o.toolOutput) take({ structuredContent: o.toolOutput, _meta: o.toolResponseMetadata || {}, content: [{ type: "text", text: JSON.stringify(o.toolOutput) }] }); }, 1500);
})();
})();
