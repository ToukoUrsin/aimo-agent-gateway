<!doctype html>
<html lang="fi">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hyväksyntä · Approval</title>

h1{font-size:var(--t6);line-height:1.25;letter-spacing:-.015em;text-wrap:balance;margin:0}
.from{font-size:var(--t2);color:var(--muted);margin:4px 0 0}

.fields label{font-size:var(--t2);font-weight:500}
.fields input{height:44px;font-size:16px;margin-top:4px}

.note>summary{padding:6px 0 4px}
.notice{background:var(--soft);border-radius:var(--r-l);padding:var(--s3) var(--s4);font-size:var(--t3);line-height:1.45}

.bar .btn.danger{color:var(--deny)}
.bar .hint{grid-column:1/-1;text-align:center;font-size:var(--t1);color:var(--muted);margin-top:2px}
.bar .hint.bad{color:var(--deny)}
.state{text-align:center;padding:var(--s5) var(--s4)}
.state .big-mark{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:0 auto var(--s3);animation:land .6s var(--ease) both}
.state .big-mark svg{width:26px;height:26px}
.state .big-mark.ok{background:var(--pass-bg);color:var(--pass)}
.state .big-mark.bad{background:var(--deny-bg);color:var(--deny)}
.state .big-mark.idle{background:var(--soft);color:var(--muted)}

.state h2{font-size:var(--t6);letter-spacing:-.015em}
.state p{margin:var(--s2) 0 0}
.fold{border-top:1px solid var(--line)}

.rows{display:flex;flex-direction:column}
.r{display:grid;grid-template-columns:1fr auto;gap:2px var(--s3);padding:10px 0;border-bottom:1px solid var(--line);font-size:var(--t3)}

.kvs{margin:var(--s3) 0 0;font-size:var(--t2);color:var(--ink-2);line-height:1.6}

.und p{margin:10px 0 0;font-size:var(--t2);line-height:1.5;color:var(--ink-2)}
.pk{font-size:var(--t2);margin:var(--s2) 0 0;line-height:1.5;color:var(--muted)}
.pk b{color:var(--ink);font-weight:600}

.sig b{color:var(--ink);font-weight:600}
.try{margin-top:var(--s3)}

.chk h3{font-size:var(--t3);margin:var(--s3) 0 var(--s2)}

.chk .rl{padding:10px 0;border-top:1px solid var(--line)}

.chk .rl .rh b{font-weight:600;min-width:0;overflow-wrap:anywhere}

</head>
<body>
<div class="banner" id="proto"></div>
<div class="top"><span class="who" id="acct"></span><div class="lang" role="group" aria-label="Kieli / Language"><button type="button" data-lang="fi">FI</button><button type="button" data-lang="en">EN</button></div></div>
<div class="net" id="net" role="status" hidden></div>
<main id="main" aria-live="polite"><p class="from"><span class="wait"><span class="spin"></span><span id="loading"></span></span></p></main>
<div class="bar" id="bar" hidden>
  <div class="in" id="barin">
    <button class="btn danger" id="no" type="button"></button>
    <button class="btn primary" id="yes" type="button"></button>
    <div class="hint"></div>
  </div>
</div>
<script src="/static/lib.js"></script>
<script src="/static/passkey.js"></script>

let lang = (() => {
  let s = null;

})();
if (lang !== "fi" && lang !== "en") lang = "fi";

// ---- The last fold, "Tekninen tallenne (englanniksi)": what the gateway decided and recorded, unchanged, in English.
function signoff() {
  const p = PKS || {}, acct = esc(p.account_name || "this account"), devs = p.devices || [];
  if (MODE === "first") return KIND === "passkey"
    ? `<p class="pk"><b>Signed on this device.</b> No approver device is enrolled for ${acct} yet. Approve makes this device the approver and signs with a passkey: it asks for the fingerprint, face or screen lock. From then on this link alone cannot approve for this account.</p>`
    : `<p class="pk"><b>Signed in this browser.</b> No approver device is enrolled for ${acct} yet. This browser has no fingerprint, face or screen lock to ask, so Approve makes a signing key here, keeps it in this browser and signs with it. The record will say: a key held in this browser, no fingerprint. From then on this link alone cannot approve for this account.</p>`;
  if (MODE === "sign_key") { const d = devs.find(x => (p.mine || []).includes(x.id)) || {}; return `<p class="pk"><b>Signed in this browser.</b> This browser is an approver for ${acct}: ${esc(d.name || "this browser")}, a key held in this browser, no fingerprint (key ${esc(d.thumbprint || "")}). Approve signs this exact order, the name, the note and each line ticked.</p>`; }
  if (MODE === "sign_passkey") return `<p class="pk"><b>Signed on an approver's device.</b> Approve asks this device for its fingerprint, face or screen lock (a passkey). The signature covers this exact order, the name, the note and each line ticked.</p>`;
  if (MODE === "add") return `<p class="pk"><b>This browser is not an approver yet.</b> Approvals for ${acct} are signed on ${esc(names(devs))}. This is the account's own session, so Approve adds this ${KIND === "passkey" ? "device as an approver with a passkey" : "browser as an approver with a key held in this browser, no fingerprint"}, and signs here.</p>`;
  if (MODE === "other") return `<p class="pk"><b>This is not one of the account's approver devices.</b> Approvals for ${acct} are signed on ${esc(names(devs))}. This link alone cannot approve; it can still reject.</p>`;

    ? `<p class="pk"><b>This browser cannot sign.</b> It can neither make a passkey nor keep a signing key, and an approval for ${acct} needs a signature from the approver's own device.</p>`
    : `<p class="pk">${p.account_kind && p.account_kind !== "sandbox" && p.account_kind !== "stage" ? "This account is a simulated customer whose approver is a script, so no device can be enrolled for it." : "No approver device is enrolled for this account."} This link approves and the gateway's own key signs the record.</p>`;
  return "";
}
function signed(c) {

    : `<p class="sig">No approver device signed: ${ap.decision === "rejected" ? "anyone holding the link may reject" : "this account is a simulated customer, a script stands in for its approver, so the link approved and the gateway's own key signed the record"}.</p>`;
  if (ap.asked_by) h += `<p class="sig">Asked by ${esc(ap.asked_by)}. ${ap.decision === "rejected" ? "Rejected" : "Approved"} by ${esc(ap.by)}.${ap.demo ? " " + esc(ap.demo) : ""}</p>`;
  if (ap.checkout_digest) h += `<p class="sig">Checkout digest <span class="mono">${esc(ap.checkout_digest)}</span>${ap.signature ? `, record signed with key <span class="mono">${esc(ap.signature.kid)}</span>` : ""}.</p>`;
  if (n) h += `<p class="sig">${ap.clears_confirmed === "each line ticked by the approver" ? "Cleared, each line ticked" : "Cleared, all at once"}: ${esc(PK.clearsText(ap.clears))}.</p>`;

  }).join("");
  const tot = c.totals.map(x => `<div class="${x.type === "total" ? "g" : ""}"><span>${x.type === "subtotal" ? t("sub") : x.type === "tax" ? esc(t("vat", num(String(x.display_text || "").replace(/^VAT\s*/, "")))) : t("total")}</span><span>${money(x.amount)}</span></div>`).join("");
  const w = c.wholesale, open = c.status === "requires_escalation";
  return `<div class="rows">${rows}</div><div class="tot">${tot}</div>
    <div class="kvs">${t("delivery")} ${esc(dayL(w.delivery_date))}${w.ship_to ? `<br>${t("shipTo")}: ${esc(shipL(w.ship_to))}` : ""}<br>${t("terms")}${w.hold && open ? `<br>${esc(t("held", clockL(w.hold.price_and_stock_held_until)))}` : ""}</div>`;
}

// ---- The page
function view(c) {
  const w = c.wholesale, open = c.status === "requires_escalation", demo = demoOwn(c), own = !!c._own && !demo;
  const rules = w.policy.rules, esc_ = rules.filter(r => r.outcome === "escalate");
  if (open && demo && !LAST.who) LAST.who = t("demoName");
  const total = (c.totals.find(x => x.type === "total") || {}).amount, sub = (c.totals.find(x => x.type === "subtotal") || {}).amount;
  const am = w.amends, goods = c.line_items.length > 0, so = !goods && (w.proposal || {}).standing;
  if (open && $("#who")) { LAST.who = $("#who").value; LAST.note = $("#note").value; }
  $("#acct").innerHTML = `<b>${esc(c.buyer.name || "")}</b>${w.customer ? esc(`${t("custno")} ${w.customer}`) : ""}`;
  let h = "";
  if (open && own) h += `<div class="own"><h2>${t("ownH")}</h2><p>${t("ownP")}</p><div class="row"><img alt="" src="/api/qr?u=${encodeURIComponent(location.href)}" onerror="this.remove()"><button class="btn lg" id="copy" type="button">${ICON.copy}<span>${t("copy")}</span></button></div>${c._review ? `<p><a href="${esc(location.pathname + location.search + "&demo=1")}">${t("ownDemo")}</a></p>` : ""}<p class="small">${t("ownSmall")}</p></div>`;
  if (open && demo) h += `<div class="notice">${t("demoNote")}</div>`;
  const st = (w.proposal || {}).standing;
  h += `<div><h1>${esc(so ? (open ? t("soOpen") : t("soChanged")) : am && open ? t("amOpen", am.order_label) : open ? t("asks", asker(c)) : t("asked", asker(c)))}</h1>`
    + `<p class="from">${shopMade(c) ? t("byShop") : t("byOther")}</p>`
    + (goods ? `<p class="what">${t("lines", c.line_items.length)} · ${t("delivery")} ${esc(dayL(w.delivery_date))}</p>` : "")
    + (st ? `<p class="what">${goods ? t("soAlso") : ""}${esc(t("so", nameFi(st.product || st.id, st.title), st.from, st.to, dayL(st.starts) || st.starts))}${goods ? "" : " " + t("soNow")}</p>` : "")
    + (goods && open ? `<div class="amount"><div class="lab">${t("total")}</div><div class="big">${money(total)}</div><div class="sub">${t("sub")} ${money(sub)}</div></div>` : "") + `</div>`;
  if (open) {
    h += `<div class="why"><b>${t("why")}</b>${esc_.map(r => `<p>${esc(plainNamed(r))}</p>`).join("")}${own ? "" : tickList(c)}</div>`;
    if (!own) {
      if (!demo && noSign()) h += `<div class="notice">${MODE === "other" ? t("other") : t("cannot")}</div>`;
      else h += `<div class="fields"><label for="who">${t("name")}</label><input type="text" id="who" value="${esc(demo ? t("demoName") : LAST.who)}" autocomplete="name" placeholder="${esc(t("namePh"))}"${demo ? " readonly" : ""}>
        <details class="note"${LAST.note || opened.has("note") ? " open" : ""} data-fold="note"><summary>${t("note")}</summary><input type="text" id="note" value="${esc(LAST.note)}" placeholder="${esc(t("notePh"))}" aria-label="${esc(t("note"))}"></details>
        <details class="note"${opened.has("honest") ? " open" : ""} data-fold="honest"><summary>${t("honestH")}</summary><p class="small" style="margin:6px 0 0">${t("honest")}</p></details></div>`;
    }
  } else if (c.status === "ready_for_complete" && w.approval) {
    const act = (am || so) && !goods;
    h += `<div class="card state">${big("ok", ICON.check)}<h2>${t("approved")}</h2><p>${esc(act ? t("canChange", asker(c)) : t("canOrder", asker(c)))}</p>${w.approval.demo ? `<p class="muted">${t("demoDone")}</p>` : ""}${c._own ? `<p><button class="btn" id="backshop" type="button" style="margin-top:8px">${t("backShop")}</button></p>` : ""}${late(c) ? `<p class="muted">${esc(act ? t("notYetCh") : t("notYet", w.hold ? clockL(w.hold.price_and_stock_held_until) : ""))}</p>` : ""}</div>`;
  } else if (c.status === "completed") {
    const head = so ? t("soChanged") : am ? (goods ? t("replPlaced", c.order.label) : t("changed", am.order_label)) : t("placed", c.order.label);
    h += `<div class="card state">${big("ok", ICON.check)}<h2>${esc(head).replace(esc((c.order || {}).label || am && am.order_label || "\u0000"), x => `<span style="white-space:nowrap">${x}</span>`)}</h2>${c.order && (c.order.url || c.order.permalink_url) ? `<p><a class="btn" href="${esc(siteUrl(c.order.url || c.order.permalink_url))}" style="margin-top:8px">${t("details")}</a></p>` : ""}</div>`;
  } else if (c.status === "canceled") {
    const rej = w.approval && w.approval.decision === "rejected";
    h += `<div class="card state">${big("bad", ICON.cross)}<h2>${rej ? t("rejected") : t("canceled")}</h2><p class="muted">${am || so ? t("nothingChanged") : t("nothingOrdered")}</p></div>`;
  } else {
    h += `<div class="card state">${big("idle", ICON.close)}<h2>${t("closedH")}</h2><p class="muted">${t("closedP")}</p></div>`;
  }
  if (goods) h += fold("rows", t("rows", c.line_items.length), rowsHtml(c));
  h += fold("checks", t("checks"), checksHtml(c));
  h += fold("tech", t("tech"), techHtml(c));
  $("#main").innerHTML = h;
  $("#bar").hidden = !open;
  $("#barin").classList.toggle("one", own);
  $("#yes").hidden = own;
  if (!busy) { $("#no").textContent = t("no"); $("#yes").textContent = t("yes"); }
  for (const box of document.querySelectorAll(".tick input")) box.onchange = () => { box.checked ? ticks.add(box.dataset.id) : ticks.delete(box.dataset.id); gate(); };
  for (const d of document.querySelectorAll("[data-fold]")) d.ontoggle = () => { d.open ? opened.add(d.dataset.fold) : opened.delete(d.dataset.fold); };
  if ($("#try")) $("#try").onclick = tryLink;
  if ($("#copy")) $("#copy").onclick = copyLink;
  // Back to the cart: this tab was opened from the shop, so it closes; if the browser keeps it, the shop opens here with the same conversation.
  if ($("#backshop")) $("#backshop").onclick = () => { try { window.close(); } catch (e) {} setTimeout(() => { location.href = "/shop"; }, 300); };
  if (open) gate();
}
async function copyLink() {
  const b = $("#copy");
  try { await navigator.clipboard.writeText(location.href); b.innerHTML = ICON.check + `<span>${t("copied")}</span>`; }
  catch (e) { b.innerHTML = `<span>${t("copyFail")}</span>`; }
  setTimeout(() => { if ($("#copy")) $("#copy").innerHTML = ICON.copy + `<span>${t("copy")}</span>`; }, 1800);
}
// Approved more than 20 seconds ago and still not ordered: the one who asked has not confirmed it yet.
const late = c => c.status === "ready_for_complete" && Date.now() - Date.parse((c.wholesale.approval || {}).at || "") > 20000;
const noSign = () => MODE === "other" || (MODE === "link" && PKS && PKS.link_ok === false);  // nothing here can sign, and the link alone does not approve
const canYes = () => !!C && (demoOwn(C) || (!C._own && !noSign())) && toClear(C).every(x => ticks.has(x.id));
// Approve works only when every line with no allergen declaration is ticked, and only where this browser can sign.
function gate() {
  if (!C || busy) return;
  const need = toClear(C), left = need.filter(x => !ticks.has(x.id)).length;
  if ($("#tickn")) $("#tickn").textContent = t("tickN", need.length - left, need.length);
  $("#yes").disabled = !canYes();
  const h = $("#bar .hint");
  if (!h.classList.contains("bad")) h.textContent = demoOwn(C) ? (left ? t("hintTick", left, need.length) : t("hintDemo")) : C._own ? t("hintOwn") : noSign() ? t("hintOther") : left ? t("hintTick", left, need.length) : t("hint");
}
function said(text) { lastErr = text || ""; const h = $("#bar .hint"); h.classList.toggle("bad", !!text); if (text) h.textContent = text; else gate(); }

// A failed poll never touches the page: it shows a small notice and the next poll tries again.
async function load() {
  let c;
  try { c = await api(`/api/approve/${cid}?k=${encodeURIComponent(k || "")}`); }
  catch (e) { $("#net").hidden = false; return null; }
  if (c && c.id) { $("#net").hidden = true; return c; }
  const m = ((c || {}).messages || [{}])[0] || {};
  if (m.code === "forbidden" || m.code === "not_found") {
    $("#net").hidden = true;
    $("#main").innerHTML = `<div class="card state">${big("bad", ICON.cross)}<h2>${t("badLink")}</h2><p class="muted">${t("badLinkP")}</p></div>`; $("#bar").hidden = true; clearInterval(timer);
  } else $("#net").hidden = false;  // busy or briefly unavailable: keep what is on screen
  return null;
}
// How this account approves, and what this browser can sign with.
async function how() {
  const p = await api(`/api/approve/${cid}/device`, { k, approve: true }).catch(() => null);
  if (!p || !p.approvals) return false;
  KIND = await PK.kindHere();
  if (p.approvals === "device") {
    const held = await PK.holds(p);
    if (held === "browser_key") { const mine = (await PK.keys()).map(x => x.id); p.mine = (p.keys || []).filter(id => mine.includes(id)); }
    MODE = held === "browser_key" ? "sign_key" : held === "passkey" ? "sign_passkey" : p.can_enrol && KIND ? "add" : "other";
  } else MODE = p.can_enrol && KIND ? "first" : "link";
  PKS = p;
  return true;
}
async function refresh(force) {
  const c = await load();
  if (!c) return;
  C = c;
  const open = c.status === "requires_escalation";
  let fresh = false;
  if (!PKS && open && !c._own) fresh = await how();
  // Redraw only when something changed, and never while someone is filling in the form.
  const sig = [c.status, (c.wholesale.approval || {}).at || "", (c.order || {}).id || "", late(c), (c._events || []).length].join("|");
  if (force || fresh || sig !== drawn) { drawn = sig; view(c); }
  if (c.status === "completed" || c.status === "canceled") clearInterval(timer);
}
const errText = e => (e && T[lang].codes[e.code]) || (e && e.content) || "";
async function decide(approve) {
  if (busy || !C) return;
  const who = $("#who") ? $("#who").value : LAST.who, note = $("#note") ? $("#note").value : LAST.note;
  const clears = toClear(C).filter(x => ticks.has(x.id)).map(x => ({ id: x.id, codes: x.codes }));
  if (approve && !who.trim()) { said(t("needName")); if ($("#who")) $("#who").focus(); return; }
  const demo = approve && demoOwn(C);  // no device signs a demo approval, and this browser does not become the approver's device
  const body = { k, approve, approver: who.trim(), note, ...(approve ? { clears } : {}), ...(demo ? { demo: true } : {}) };
  const back = text => { busy = false; $("#no").disabled = false; $("#yes").disabled = !canYes(); $("#no").textContent = t("no"); $("#yes").textContent = text && approve ? t("tryAgain") : t("yes"); said(text); };
  busy = true; $("#yes").disabled = $("#no").disabled = true; said("");
  // Never fall back to the bare link because a question to the gateway was lost: first learn how this account approves.
  if (approve && !demo && !PKS && !(await how())) return back(t("errNet"));
  const b = approve ? $("#yes") : $("#no");
  const say = x => { b.innerHTML = '<span class="spin"></span>' + x; };
  say(approve ? t("approving") : t("rejecting"));
  let r;
  try {
    if (approve && !demo && (MODE === "first" || MODE === "add")) {
      // No device signs for this account here yet: this one becomes an approver, then signs. One press.
      try { await PK.enrol({ cid, k }); }
      catch (e) {
        if (e && e.name === "NotAllowedError") return back(t("errPrompt"));
        if (e && e.name === "InvalidStateError") { await how(); if (MODE !== "sign_passkey") return back(t("errEnrolled")); }
        else return back(t("errDevice"));
      }
      if (!(await how()) || (MODE !== "sign_key" && MODE !== "sign_passkey")) { view(C); return back(t("errAgain")); }
    }
    if (approve && !demo && (MODE === "sign_key" || MODE === "sign_passkey")) {
      const pre = await api(`/api/approve/${cid}/device`, body);
      if (!pre.challenge) return back(errText((pre.messages || [{}])[0]) || t("errPrep"));
      try { body.device = await PK.sign(pre); }
      catch (e) { return back(e && e.name === "NotAllowedError" ? t("errPrompt") : e && e.name === "NotEnrolledError" ? t("errNotDev") : t("errSign")); }
    }
    r = await api(`/api/approve/${cid}`, body);
  } catch (e) {
    // No answer came back. The decision may still have been recorded: read the request again before saying it was not.
    const now = await load();
    if (now && now.status !== "requires_escalation") { busy = false; said(""); return refresh(true); }
    return back(now ? t("errLost") : t("errUnknown"));
  }
  const err = !r.id && (r.messages || []).find(m => m.type === "error");
  // Someone enrolled a device for this account while this page was open: find out what this browser can do, and say so.
  if (err && err.code === "device_required" && !body.device) { await how(); view(C); return back(MODE === "other" ? t("errNowOther") : t("errNowDev")); }
  if (err && err.code === "offer_changed") { PKS = null; await refresh(true); return back(errText(err)); }  // the rules were run again at the yes: show the current offer
  if (err && err.code === "own_request") { await refresh(true); return back(errText(err)); }
  if (err) return back(errText(err));
  busy = false;
  refresh(true);
}

// ---- Language: the same switch and the same stored choice as the shop
function paint() {
  document.documentElement.lang = lang;
  document.title = t("title") + " · Valio Aimo";
  $("#proto").textContent = t("proto");
  $("#net").textContent = t("net");
  if ($("#loading")) $("#loading").textContent = t("loading");
  for (const b of document.querySelectorAll("[data-lang]")) b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  if (!busy) { $("#no").textContent = t("no"); $("#yes").textContent = t("yes"); }
  $("#bar .hint").classList.remove("bad");
  if (C) view(C);
}
for (const b of document.querySelectorAll("[data-lang]")) b.onclick = () => {
  if (b.dataset.lang === lang) return;
  if ($("#who")) { LAST.who = $("#who").value; LAST.note = $("#note").value; }
  lang = b.dataset.lang; try { localStorage.setItem("shop.lang", lang); } catch (e) {}
  paint();
};
paint();
$("#yes").onclick = () => decide(true);
$("#no").onclick = () => decide(false);
refresh(true);
timer = setInterval(() => { if (!busy) refresh(false).catch(() => {}); }, 1500);
</script>
</body>
</html>
